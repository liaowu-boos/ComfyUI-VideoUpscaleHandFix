[project]
name = "comfyui-videoupscalehandfix"
description = "ComfyUI custom node: Real-ESRGAN video upscale with MediaPipe hand region enhancement for real-person dance footage"
version = "1.0.0"
license = { text = "MIT" }
authors = [{ name = "liaowu" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.5",
    "mediapipe>=0.10",
    "realesrgan>=0.3",
    "basicsr>=1.4",
    "gfpgan>=1.3",
    "facexlib>=0.3",
    "scipy>=1.7",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/liaowu-boos/ComfyUI-VideoUpscaleHandFix"
"Bug Tracker" = "https://github.com/liaowu-boos/ComfyUI-VideoUpscaleHandFix/issues"

[tool.comfy]
PublisherId = "liaowu"
DisplayName = "ComfyUI-VideoUpscaleHandFix"
Icon = ""
includes = []
